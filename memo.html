<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메모를 남기자!</title>
    <style>
      /* 전체 공통으로 작동해야하는 태그 수준의 서식 */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      textarea {
        resize: none;
      }
      /* 반복해서 쓰이는 내용은 클래스로 작성 */
      .center {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* id로 특정하게 쓸 요소들에 대한 서식 */
      /* id를 의미하는 선택자 # */
      #page {
        height: 100vh;
        flex-direction: column;
      }

      #container {
        flex-direction: column;
      }

      #container h1 {
        /* align, justify */
        text-align: center;
      }

      #memoWriter {
        flex-direction: column;
        gap: 8px;
        background-color: beige;
        padding: 16px;
        border: 1px solid gray;
        border-radius: 8px;
        /* 원/타원 만들 때 */
        /* border-radius: 50%; */
      }

      #memoWriter button {
        padding: 6px 12px;
        /* margin, padding : 전체 */
        /* margin, padding : 위 아래 */
        /* margin, padding : 위 오 아 왼 */
      }

      #memoList {
        gap: 8px;
        padding: 8px;
        flex-wrap: wrap;
      }

      #memoList div {
        width: 240px;
        height: 160px;
        border: 1px solid gray;
        border-radius: 8px;
        padding: 16px;
        /* https://colorhunt.co/ */
        background-color: #fff7c5;
      }
    </style>
  </head>
  <body>
    <section id="page" class="center">
      <section id="container" class="center">
        <h1>메모를 남기자!</h1>
        <form id="memoWriter" class="center">
          <!-- validation : 검증 -->
          <!-- 프런트엔드/브라우저/화면에서의 검증은 모두 회피/조작 -->
          <textarea name="memo" required></textarea>
          <button>작성</button>
        </form>
        <section id="memoList" class="center">
          <!-- 작성된 메모를 배치 -->
        </section>
      </section>
    </section>
    <script>
      document.addEventListener("DOMContentLoaded", main);

      // DOM 요소
      const memoWriter = document.querySelector("#memoWriter");
      const memoList = document.querySelector("#memoList");

      // 진입점. entrypoint
      function main() {
        console.log("DOM 로딩 완료");
        memoWriter.addEventListener("submit", memoWriterHandler);
      }
      // 1. 일단 함수표현식으로 타입추론을 하면서 작성한다음에
      // 2. 나중에 꺼내서 아래에 배치
      function memoWriterHandler(event) {
        // form의 기본 이벤트를 금지/정지 시킨다
        event.preventDefault();
        console.log("form 로직 시작");
        const formData = new FormData(event.target);
        // console.log(formData);
        console.log(...formData);
        const memoBox = document.createElement("div");
        // memoBox.classList.add
        memoBox.textContent = formData.get("memo");
        memoList.append(memoBox);
      }
    </script>
  </body>
</html>
